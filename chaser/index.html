<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigChaser ⚡ - Payment Chaser for DJs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0a0a0a;
      color: #f4f4f5;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    /* Top Tool Switcher Nav */
    .tool-nav {
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
      padding: 4px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      display: flex;
      gap: 6px;
    }
    .tool-nav a {
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      display: block;
      transition: all 0.15s ease;
    }
    .tool-nav a.inactive {
      color: #a1a1aa;
    }
    .tool-nav a.inactive:hover {
      color: #ffffff;
      background: #27272a;
    }
    .tool-nav a.active {
      background: #f59e0b;
      color: #09090b;
      font-weight: 700;
    }

    /* Container Card */
    .card {
      width: 100%;
      max-width: 420px;
      background: #121214;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 12px;
      color: #a1a1aa;
      margin-top: 4px;
    }

    /* Form Fields */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-row {
      display: flex;
      gap: 10px;
    }
    .field-row > div {
      flex: 1;
    }
    label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a1a1aa;
    }
    input {
      width: 100%;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus {
      border-color: #f59e0b;
    }

    /* Tone Selector */
    .tone-buttons {
      display: flex;
      gap: 8px;
    }
    .tone-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 8px;
      border: 1px solid #27272a;
      background: #09090b;
      color: #a1a1aa;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tone-btn.active {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #09090b;
    }

    /* Message Output */
    .output-box {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #d4d4d8;
      min-height: 90px;
      white-space: pre-wrap;
    }

    /* Action Buttons */
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn-action {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-action:hover {
      opacity: 0.9;
    }
    .btn-copy {
      background: #27272a;
      color: #ffffff;
    }
    .btn-whatsapp {
      background: #10b981;
      color: #042f2e;
    }
  </style>
</head>
<body>

  <!-- Top Tool Switcher Nav -->
  <nav class="tool-nav">
    <a href="../" class="inactive">Invoice Generator</a>
    <a href="./" class="active">GigChaser ⚡</a>
  </nav>

  <!-- Chaser Tool Container -->
  <main class="card">
    <div class="header">
      <h1>GigChaser ⚡</h1>
      <p>1-Tap payment reminder generator for gigging artists</p>
    </div>

    <div class="field-group">
      <label for="promoter">Promoter / Client Name</label>
      <input id="promoter" type="text" placeholder="e.g. Dave" oninput="updateMessage()">
    </div>

    <div class="field-row">
      <div class="field-group">
        <label for="venue">Venue / Event</label>
        <input id="venue" type="text" placeholder="e.g. Fabric" oninput="updateMessage()">
      </div>
      <div class="field-group">
        <label for="amount">Amount (£)</label>
        <input id="amount" type="number" placeholder="e.g. 250" oninput="updateMessage()">
      </div>
    </div>

    <div class="field-group">
      <label for="invoiceNum">Invoice Number (Optional)</label>
      <input id="invoiceNum" type="text" placeholder="e.g. 004" oninput="updateMessage()">
    </div>

    <div class="field-group">
      <label>Tone</label>
      <div class="tone-buttons">
        <button type="button" id="btn-friendly" class="tone-btn active" onclick="setTone('friendly')">Friendly</button>
        <button type="button" id="btn-firm" class="tone-btn" onclick="setTone('firm')">Firm</button>
        <button type="button" id="btn-statutory" class="tone-btn" onclick="setTone('statutory')">Statutory</button>
      </div>
    </div>

    <div class="field-group">
      <label>Generated Message</label>
      <div id="output" class="output-box"></div>
    </div>

    <div class="action-row">
      <button type="button" id="copyBtn" class="btn-action btn-copy" onclick="copyMessage()">Copy Text</button>
      <button type="button" class="btn-action btn-whatsapp" onclick="openWhatsApp()">WhatsApp 📲</button>
    </div>
  </main>

  <script>
    let currentTone = 'friendly';

    function setTone(tone) {
      currentTone = tone;
      document.querySelectorAll('.tone-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${tone}`).classList.add('active');
      updateMessage();
    }

    function generateText() {
      const p = document.getElementById('promoter').value.trim() || 'there';
      const venue = document.getElementById('venue').value.trim();
      const amount = document.getElementById('amount').value.trim();
      const invoiceNum = document.getElementById('invoiceNum').value.trim();

      const v = venue ? ` for the set at ${venue}` : '';
      const inv = invoiceNum ? ` (Ref: #${invoiceNum})` : '';
      const amt = amount ? ` of £${amount}` : '';

      if (currentTone === 'friendly') {
        return `Hey ${p}, hope you're well! Just following up on the invoice${inv}${amt}${v}. Let me know once the transfer goes through so I can mark it off. Thanks!`;
      }
      if (currentTone === 'firm') {
        return `Hi ${p}, following up regarding outstanding invoice${inv}${amt}${v}, which is now overdue. Please confirm when the payment will be released. Bank details are on the invoice.`;
      }
      return `FORMAL NOTICE: Outstanding payment${inv}${amt}${v} is now past its agreed due date. In accordance with the Late Payment of Commercial Debts Act, statutory interest and fixed recovery fees may be applied. Please ensure settlement within 48 hours to avoid escalation.`;
    }

    function updateMessage() {
      document.getElementById('output').textContent = generateText();
    }

    function copyMessage() {
      const text = generateText();
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied! ✓';
        setTimeout(() => { btn.textContent = 'Copy Text'; }, 2000);
      });
    }

    function openWhatsApp() {
      const text = generateText();
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    updateMessage();
  </script>
</body>
</html>
